name: Tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  test:
    name: Utilities
    runs-on: ubuntu-latest
    steps:
      # the Unity editor image needs more space than a fresh runner has
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout Package (Utilities)
        uses: actions/checkout@v4
        with:
          path: kott-utilities
          fetch-depth: 1

      # packageMode creates a temporary empty project and adds the repo root as a testable package
      - uses: game-ci/unity-test-runner@v4 #.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: kott-utilities
          unityVersion: 6000.3.19f1
          # customImage: unityci/editor:ubuntu-6000.3.19f1-base-3
          testMode: All # runs PlayMode and EditMode tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (Utilities)
