name: Tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  test:
    name: Test Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Package
        uses: actions/checkout@v4
        with:
          path: kott-utilities
          fetch-depth: 1

      # packageMode creates a temporary empty project and adds the repo root as a testable package
      - name: Run Package Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: kott-utilities
          unityVersion: 6000.3.19f1
          testMode: All # runs PlayMode and EditMode tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (Utilities)
